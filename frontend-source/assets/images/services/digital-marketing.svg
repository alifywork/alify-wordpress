<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" fill="none">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12151C"/><stop offset="1" stop-color="#1B202B"/></linearGradient><linearGradient id="horn" x2="1" y2="1"><stop stop-color="#E05A3A"/><stop offset="1" stop-color="#0F3473"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#0F3473" stroke-opacity=".07"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="20"/></filter></defs>
  <style>.wave{transform-box:fill-box;transform-origin:left center;animation:signal 3s ease-out infinite}.w2{animation-delay:1s}.w3{animation-delay:2s}.metric{animation:float 5s ease-in-out infinite}.m2{animation-delay:.8s}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.5s ease-in-out infinite}.b2{animation-delay:.25s}.b3{animation-delay:.5s}.b4{animation-delay:.75s}.heart{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}.megaphone{transform-origin:330px 290px;animation:sway 5s ease-in-out infinite}@keyframes signal{0%{transform:scale(.65);opacity:0}30%{opacity:1}100%{transform:scale(1.1);opacity:0}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes grow{0%,15%{transform:scaleY(.25)}55%,90%{transform:scaleY(1)}}@keyframes pulse{50%{transform:scale(1.18)}}@keyframes sway{50%{transform:rotate(-3deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
