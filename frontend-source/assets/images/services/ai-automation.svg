<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" fill="none">
  <defs><radialGradient id="bg"><stop stop-color="#1B202B"/><stop offset="1" stop-color="#12151C"/></radialGradient><linearGradient id="chip" x2="1" y2="1"><stop stop-color="#0F3473"/><stop offset="1" stop-color="#181C24"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#0F3473" stroke-opacity=".07"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="15"/></filter></defs>
  <style>.flow{stroke-dasharray:8 12;animation:flow 3s linear infinite}.node{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}.n2{animation-delay:.5s}.n3{animation-delay:1s}.n4{animation-delay:1.5s}.core{transform-origin:500px 280px;animation:breathe 4s ease-in-out infinite}.gear{transform-box:fill-box;transform-origin:center;animation:spin 10s linear infinite}@keyframes flow{to{stroke-dashoffset:-40}}@keyframes pulse{50%{transform:scale(1.12);filter:brightness(1.4)}}@keyframes breathe{50%{transform:scale(1.035)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect width="1000" height="560" rx="28" fill="url(#bg)"/><rect width="1000" height="560" rx="28" fill="url(#grid)"/><circle cx="500" cy="280" r="130" fill="#E05A3A" opacity=".13" filter="url(#glow)"/>
  <g stroke="#0F3473" stroke-width="2"><path d="M500 280L206 125M500 280L794 125M500 280L206 435M500 280L794 435M500 280V58M500 280V502"/><path class="flow" d="M206 125L500 280 794 125M206 435L500 280 794 435M500 58V502" stroke="#E05A3A" stroke-width="3"/></g>

  <g class="core"><rect x="389" y="169" width="222" height="222" rx="48" fill="#12151C" stroke="#E05A3A" stroke-opacity=".35" stroke-width="2"/><rect x="410" y="190" width="180" height="180" rx="36" fill="url(#chip)" stroke="#E05A3A"/><g stroke="#E05A3A" stroke-width="3" opacity=".6"><path d="M389 213h-24M389 247h-24M389 313h-24M389 347h-24M611 213h24M611 247h24M611 313h24M611 347h24M433 169v-24M467 169v-24M533 169v-24M567 169v-24M433 391v24M467 391v24M533 391v24M567 391v24"/></g><text x="500" y="268" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="55" font-weight="700">AI</text><text x="500" y="302" text-anchor="middle" fill="#E05A3A" font-family="Arial,sans-serif" font-size="11" letter-spacing="4">AUTOMATION</text><path d="M458 329h84" stroke="#D98A2B" stroke-width="3" stroke-linecap="round"/><circle cx="448" cy="329" r="4" fill="#D98A2B"/><circle cx="552" cy="329" r="4" fill="#D98A2B"/></g>
  <g class="node"><rect x="105" y="74" width="202" height="102" rx="20" fill="#202631" stroke="#343A46"/><circle cx="144" cy="125" r="23" fill="#E05A3A" fill-opacity=".13"/><path d="M134 125h20M144 115v20" stroke="#E05A3A" stroke-width="3" stroke-linecap="round"/><text x="181" y="118" fill="#F6F4F1" font-family="Arial,sans-serif" font-size="13" font-weight="700">Collect data</text><text x="181" y="140" fill="#9A9FA8" font-family="Arial,sans-serif" font-size="11">Input received</text></g>
  <g class="node n2"><rect x="693" y="74" width="202" height="102" rx="20" fill="#202631" stroke="#343A46"/><circle cx="732" cy="125" r="23" fill="#D98A2B" fill-opacity=".15"/><path d="M722 130l7-12 6 8 8-14" stroke="#D98A2B" stroke-width="3" stroke-linecap="round"/><text x="769" y="118" fill="#F6F4F1" font-family="Arial,sans-serif" font-size="13" font-weight="700">Make decisions</text><text x="769" y="140" fill="#9A9FA8" font-family="Arial,sans-serif" font-size="11">Logic applied</text></g>
  <g class="node n3"><rect x="105" y="384" width="202" height="102" rx="20" fill="#202631" stroke="#343A46"/><circle cx="144" cy="435" r="23" fill="#0F8A73" fill-opacity=".12"/><path d="M133 435l7 7 15-17" stroke="#0F8A73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="181" y="428" fill="#F6F4F1" font-family="Arial,sans-serif" font-size="13" font-weight="700">Run workflow</text><text x="181" y="450" fill="#9A9FA8" font-family="Arial,sans-serif" font-size="11">Task complete</text></g>
  <g class="node n4"><rect x="693" y="384" width="202" height="102" rx="20" fill="#202631" stroke="#343A46"/><g class="gear"><path d="M730 415l5 5 9-2 3 8 8 4-2 9 5 6-5 6 2 9-8 4-3 8-9-2-5 5-5-5-9 2-3-8-8-4 2-9-5-6 5-6-2-9 8-4 3-8 9 2z" fill="#E05A3A" fill-opacity=".16" transform="translate(0 -20) scale(.7)"/><circle cx="732" cy="435" r="10" stroke="#E05A3A" stroke-width="3"/><circle cx="732" cy="435" r="3" fill="#E05A3A"/></g><text x="769" y="428" fill="#F6F4F1" font-family="Arial,sans-serif" font-size="13" font-weight="700">Keep learning</text><text x="769" y="450" fill="#9A9FA8" font-family="Arial,sans-serif" font-size="11">Always improving</text></g>
